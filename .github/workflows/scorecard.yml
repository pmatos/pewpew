name: Scorecard supply-chain security

on:
  # Re-run whenever a branch protection rule changes, weekly, and on pushes to
  # the default branch. Not run on PRs (needs write scopes only main should have).
  branch_protection_rule:
  schedule:
    - cron: '17 4 * * 1' # Weekly, Mondays 04:17 UTC
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # upload the results SARIF to the Security tab
      id-token: write # publish results to the OpenSSF Scorecard API

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
