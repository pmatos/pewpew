# Lints commit messages against Conventional Commits.
# - push to main: covers direct pushes/merges, which lint-pr-title.yml can't see.
# - pull_request: lints the PR's own commit range before merge, since
#   lint-pr-title.yml only validates the PR title, not each commit.
name: Lint commits

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: lts/*
      - name: Install commitlint
        run: npm install --no-save @commitlint/cli@21 @commitlint/config-conventional@21
      - name: Lint pushed commits
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: npx commitlint --from ${{ github.event.before }} --to ${{ github.sha }} --verbose
      - name: Lint PR commits
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
