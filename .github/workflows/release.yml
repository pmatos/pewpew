name: Release

# Releases are cut by semantic-release on a weekly batch schedule (Sundays
# 00:00 UTC): it derives the next version from Conventional Commit types
# accumulated on main since the last release, builds the Linux AppImage + deb
# via electron-builder, and publishes a GitHub Release (notes + CHANGELOG +
# artifacts + checksums). No-op if nothing releasable landed that week. Use
# workflow_dispatch to cut a release on demand between scheduled runs.
on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch: {}

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run semantic-release
        uses: cycjimmy/semantic-release-action@v6.0.0
        with:
          extra_plugins: |
            @semantic-release/changelog@6
            @semantic-release/git@10
            @semantic-release/exec@7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
