name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semver bump (ignored if explicit `version` is set)'
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
      version:
        description: 'Explicit version (e.g. 1.2.3). Overrides `bump` if set.'
        type: string
        required: false
        default: ''
      draft:
        description: 'Publish release as draft'
        type: boolean
        required: false
        default: false
      prerelease:
        description: 'Mark release as pre-release'
        type: boolean
        required: false
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Bump version and build Linux artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # This job pushes the version bump commit + tag, so checkout credentials
      # must persist for the later `git push` steps — artipacked is expected here.
      - name: Checkout (full history for tagging) # zizmor: ignore[artipacked]
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate branch
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Release must be run from 'main' (got ${GITHUB_REF_NAME})." >&2
            exit 1
          fi

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install system build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential python3 fakeroot dpkg rpm

      - name: Configure git author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Install dependencies
        run: npm ci

      - name: Verify tree (lint + type-check + tests)
        run: |
          npx prettier --check .
          npx eslint .
          npx tsc --noEmit
          npx vitest run

      - name: Bump version
        id: bump
        env:
          VERSION: ${{ inputs.version }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          if [ -n "$VERSION" ]; then
            NEW_VERSION="$(npm version "$VERSION" --no-git-tag-version)"
          else
            NEW_VERSION="$(npm version "$BUMP" --no-git-tag-version)"
          fi
          # `npm version` returns the new version prefixed with `v`
          echo "version=${NEW_VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "tag=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Bumped to ${NEW_VERSION}"

      - name: Commit + tag
        env:
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          git add package.json package-lock.json
          git commit -m "chore(release): $TAG"
          git tag -a "$TAG" -m "Release $TAG"

      - name: Build Linux artifacts (AppImage + deb)
        env:
          # electron-builder reads GH_TOKEN for metadata enrichment even when we
          # don't publish through it.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:linux

      - name: Collect release artifacts
        id: artifacts
        run: |
          set -euo pipefail
          mkdir -p ./release-upload
          shopt -s nullglob
          for f in release/*.AppImage release/*.deb release/latest-linux.yml; do
            cp "$f" ./release-upload/
          done
          (cd ./release-upload && sha256sum -- * > SHA256SUMS.txt)
          ls -la ./release-upload

      - name: Push version bump + tag
        env:
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "$TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.bump.outputs.tag }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          args=(--generate-notes --title "$TAG")
          if [ "$DRAFT" = "true" ]; then args+=(--draft); fi
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          gh release create "$TAG" \
            "${args[@]}" \
            ./release-upload/*

      - name: Open next dev cycle
        if: ${{ inputs.draft != true && inputs.prerelease != true }}
        run: |
          set -euo pipefail
          NEXT="$(npm version prepatch --preid=pre --no-git-tag-version)"
          git add package.json package-lock.json
          git commit -m "chore: open ${NEXT#v} dev cycle"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload build artifacts (for debugging / reruns)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-artifacts-${{ steps.bump.outputs.tag }}
          path: release-upload/
          if-no-files-found: warn
          retention-days: 14
