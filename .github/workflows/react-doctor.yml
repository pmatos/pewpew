name: React Doctor

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write # required to post PR comments
  statuses: write # required to publish the React Doctor commit status

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # required for `diff`
          persist-credentials: false

      - uses: millionco/react-doctor@695e46eee203a5d1855020191aa7e9c010a1250e # v2.4.0
        with:
          scope: changed
          # A failed analyzer also degrades the baseline and triggers the same
          # shallow-checkout warning even though the full history is present.
          silence-missing-baseline-warning: true
