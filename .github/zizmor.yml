# zizmor configuration
# https://docs.zizmor.sh/configuration/

rules:
  # Actions are pinned to release tags (e.g. @v7) rather than commit SHAs.
  # Allow any ref-pin (tag/branch) instead of zizmor's default blanket hash-pin
  # requirement. Tag updates are handled by the github-actions Dependabot group.
  unpinned-uses:
    config:
      policies:
        '*': ref-pin
  adhoc-packages:
    ignore:
      # commitlint deps are only used by this CI-only linting step (never
      # shipped), and are version-pinned to a major release; not worth a
      # dedicated lockfile entry in the main package.json.
      - commitlint.yml:27
  dangerous-triggers:
    ignore:
      # Needed to read fork PR titles with API access, but this workflow
      # never checks out or executes PR-controlled code, so the usual
      # pull_request_target injection risk doesn't apply here.
      - lint-pr-title.yml:5
